<title>Pult Component Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working surface – a bar of controls, the drawing, a side panel (bottom sheet on phones), the version slider. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #1d232b; --mut: #5f6873; --line: #c9cec9; --soft: #e6e9e4;
  --acc: #1f5f8b;          /* the app's own blue, for selection */
  --up: #2563a8;           /* what the selected part uses */
  --down: #c2410c;         /* what uses the selected part */
  --flow: #7c5aa6;         /* data flows */
  --h0: #d9ddd8; --h1: #b9dfd4; --h2: #f2e39a; --h3: #f7c06a; --h4: #ef8a4f; --h5: #d9483b;
  --display: "Gentium Book Plus", Georgia, serif; --ui: "Source Sans 3", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161b; --surface: #1a2027; --ink: #e5e8ea; --mut: #98a2ad; --line: #39424c; --soft: #232a32;
  --acc: #6aa9d8; --up: #6aa9ec; --down: #f08a4b; --flow: #b394e0;
  --h0: #39414a; --h1: #2f6b5f; --h2: #7d7034; --h3: #96662a; --h4: #a3502c; --h5: #a83a32; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161b; --surface: #1a2027; --ink: #e5e8ea; --mut: #98a2ad; --line: #39424c; --soft: #232a32;
  --acc: #6aa9d8; --up: #6aa9ec; --down: #f08a4b; --flow: #b394e0;
  --h0: #39414a; --h1: #2f6b5f; --h2: #7d7034; --h3: #96662a; --h4: #a3502c; --h5: #a83a32; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
h1 { font: 700 17px/1.1 var(--display); flex: none; margin: 0; letter-spacing: .01em; white-space: nowrap; }
h1 small { font: 400 12px var(--ui); color: var(--mut); margin-left: 6px; }
.grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); }
.seg { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 3px 8px; font: 600 12.5px var(--ui); cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
button.plain { flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 7px; padding: 3px 9px; font: 600 12.5px var(--ui); cursor: pointer; white-space: nowrap; }
.rng { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mut); }
.rng input { width: 110px; accent-color: var(--acc); }
.menu { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 10px 28px rgba(0,0,0,.2); padding: 10px 12px; display: grid; gap: 8px; }
.menu .row { display: flex; gap: 8px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; user-select: none; }
.search { position: relative; flex: 1 1 150px; min-width: 90px; max-width: 280px; }
select.sm { display: none; flex: 0 1 auto; min-width: 64px; max-width: 120px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font: 600 12.5px var(--ui); padding: 3px 4px; }
@media (max-width: 1100px) { header .seg { display: none; } select.sm { display: block; } h1 { display: none; } .rng input { width: 80px; } }
@media (max-width: 560px) { .rng span { display: none; } .rng input { width: 56px; } #optBtn .t { display: none; } header { gap: 5px 6px; } }
#fsBtn .t { display: none; }
.search input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; background: var(--bg); color: var(--ink); font: 14px var(--ui); }
.results { position: fixed; width: 300px; z-index: 20; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 50vh; overflow: auto; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 7px 10px; cursor: pointer; font: 14px var(--ui); }
.results button:hover, .results button.on { background: var(--soft); }
.results small { color: var(--mut); display: block; font-size: 12px; }
main { flex: 1; display: flex; min-height: 0; position: relative; }
#stage { flex: 1; min-width: 0; position: relative; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
svg#cv, #cv3 { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv3:active { cursor: grabbing; }
#panel { width: 380px; max-width: 42vw; border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 16px 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
#panel h2 { font: 700 22px/1.15 var(--display); margin: 0 0 4px; text-wrap: balance; }
#panel h3 { font: 600 11px var(--ui); text-transform: uppercase; letter-spacing: .07em; color: var(--mut); margin: 18px 0 6px; }
#panel p { margin: 6px 0; max-width: 65ch; }
.crumbs { font-size: 12px; color: var(--mut); }
.crumbs a { color: var(--mut); cursor: pointer; text-decoration: underline dotted; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pill { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.res { display: grid; grid-template-columns: 74px 1fr; gap: 6px 10px; align-items: start; }
.res .bar { display: flex; gap: 3px; margin-top: 4px; }
.res .bar i { width: 16px; height: 8px; border-radius: 2px; background: var(--soft); }
.res .note { grid-column: 2; font-size: 12.5px; color: var(--mut); margin-top: -2px; }
.res b { font-weight: 600; font-size: 13px; }
.list { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.list li { padding: 3px 0; border-bottom: 1px solid var(--soft); display: flex; gap: 8px; justify-content: space-between; }
.list code, .mono { font: 12px var(--mono); }
.list a { color: var(--ink); cursor: pointer; }
.list .k { color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dirup { color: var(--up); } .dirdown { color: var(--down); } .dirflow { color: var(--flow); }
.legend { font-size: 12.5px; color: var(--mut); display: grid; gap: 4px; }
.legend span.sw { display: inline-block; width: 22px; height: 3px; vertical-align: middle; margin-right: 6px; }
.heat { display: flex; gap: 2px; align-items: center; }
.heat i { width: 18px; height: 10px; border-radius: 2px; }
footer { border-top: 1px solid var(--line); background: var(--surface); padding-block: 3px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: center; }
footer #play { padding: 1px 8px; }
.track { position: relative; flex: 1 1 45%; min-width: 120px; height: 22px; }
.track input { position: absolute; inset: 0; width: 100%; margin: 0; background: transparent; }
footer input[type=range] { accent-color: var(--acc); }
#verInfo { flex: 1 1 55%; min-width: 0; font-size: 12px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#verInfo b { color: var(--ink); }
#spark { position: absolute; inset: 0; height: 22px; width: 100%; display: block; opacity: .7; }
.node rect.box { stroke: var(--line); stroke-width: 1; }
.node text { fill: var(--ink); font: 600 12.5px var(--ui); pointer-events: none; }
.node text.sub { font: 400 10.5px var(--mono); fill: var(--mut); }
.node { cursor: pointer; }
.node.sel rect.box { stroke: var(--acc); stroke-width: 2.5; }
.node.chg rect.box { stroke: var(--flow); stroke-width: 2; stroke-dasharray: 4 3; }
.node.fade, .edge.fade { opacity: .05; }
.node.off { opacity: .32; }
.group > rect { fill: none; stroke: var(--line); stroke-dasharray: 3 3; }
.group > text { fill: var(--mut); font: 600 11px var(--ui); letter-spacing: .05em; text-transform: uppercase; }
.tier text { fill: var(--mut); font: italic 400 15px var(--display); }
.tier line { stroke: var(--line); }
.edge { fill: none; stroke: var(--mut); stroke-opacity: .35; }
.edge.flow { stroke: var(--flow); stroke-dasharray: 5 3; stroke-opacity: .55; }
.edge.up { stroke: var(--up); stroke-opacity: .95; }
.edge.down { stroke: var(--down); stroke-opacity: .95; }
.elabel { font: 11px var(--ui); fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--mut); background: color-mix(in srgb, var(--bg) 85%, transparent); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font-size: 12.5px; max-width: 280px; box-shadow: 0 6px 18px rgba(0,0,0,.15); z-index: 5; }
@media (max-width: 760px) {
  main { flex-direction: column; }
  #panel { width: auto; max-width: none; height: 34%; border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  h1 small { display: none; }
}
/* full screen: only the drawing; the panel of a selected part floats over its lower edge */
body.full footer { display: none; }
body.full #panel { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: auto; max-width: 560px; height: auto; max-height: 38%; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.22); z-index: 6; }
body.full.nosel #panel { display: none; }
body.full .hint { display: none; }
.fsx { position: absolute; z-index: 7; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); background: var(--surface); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header>
  <h1>Pult Atlas<small id="hdrVer"></small></h1>
  <div class="search"><input id="q" type="search" placeholder="Find a part or function…" autocomplete="off" aria-label="Find a part"><div class="results" id="res" hidden></div></div>
  <div class="seg" id="segLayout" title="Layout"><button data-v="layers" aria-pressed="true">Layers</button><button data-v="web" aria-pressed="false">Web</button><button data-v="3d" aria-pressed="false">3D</button></div>
  <div class="seg" id="segMetric" title="Colour by"><button data-v="part" aria-pressed="true">Part</button><button data-v="mem" aria-pressed="false" title="Memory">Mem</button><button data-v="store" aria-pressed="false" title="Storage">Store</button><button data-v="cpu" aria-pressed="false">CPU</button><button data-v="gpu" aria-pressed="false">GPU</button></div>
  <div class="seg" id="segFocus" title="With a part selected, show only…"><button data-v="all" aria-pressed="true">All</button><button data-v="up" aria-pressed="false" title="only what the selected part relies on">Relies on</button><button data-v="down" aria-pressed="false" title="only what relies on the selected part">Relied on by</button><button data-v="both" aria-pressed="false" title="only the selected part's connections">Both</button></div>
  <select class="sm" id="selLayout" aria-label="Layout"><option value="layers">Layers</option><option value="web">Web</option><option value="3d">3D</option></select>
  <select class="sm" id="selMetric" aria-label="Colour by"><option value="part">Part</option><option value="mem">Memory</option><option value="store">Storage</option><option value="cpu">CPU</option><option value="gpu">GPU</option></select>
  <select class="sm" id="selFocus" aria-label="Show"><option value="all">All</option><option value="up">Relies on</option><option value="down">Relied on by</option><option value="both">Both</option></select>
  <label class="rng" title="How far apart the parts are"><span>Spacing</span> <input type="range" id="spread" min="0.4" max="3" step="0.05" value="1" aria-label="Spacing"></label>
  <button class="plain" id="optBtn" aria-expanded="false" title="Options"><span class="t">Options </span>▾</button>
  <button class="plain" id="fsBtn" title="Full screen">⛶<span class="t"> Full screen</span></button>
</header>
<div class="menu" id="opts" hidden>
  <label class="chk"><input type="checkbox" id="ind" checked> Load indicators</label>
  <label class="chk"><input type="checkbox" id="offv"> Offline view</label>
  <label class="chk"><input type="checkbox" id="lbl"> Flow labels</label>
  <label class="chk"><input type="checkbox" id="chain"> Whole chains</label>
  <div class="row"><button class="plain" id="expAll">Expand all</button><button class="plain" id="colAll">Collapse</button></div>
</div>
<main>
  <div id="stage"><svg id="cv" aria-label="Components of Pult and how they connect"></svg><canvas id="cv3" hidden aria-label="Components of Pult in three dimensions"></canvas><div class="hint" id="hint">Tap a part to see it; double-tap or ▸ to open it</div><div class="tip" id="tip" hidden></div></div>
  <aside id="panel"></aside>
</main>
<footer>
  <button class="plain" id="play" aria-label="Play through the versions">▶</button>
  <div class="track"><svg id="spark" aria-hidden="true"></svg><input type="range" id="ver" min="0" max="0" value="0" aria-label="Version"></div>
  <div id="verInfo"></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const METRICS = { mem: 'Memory', store: 'Storage', cpu: 'CPU', gpu: 'GPU' };
const S = { layout: 'layers', metric: 'part', ind: true, offv: false, lbl: false, exp: new Set(), sel: null, ver: 0, depth: 1, focus: 'all', spread: 1, rot: 0 };
try { const k = JSON.parse(localStorage.getItem('atlas') || '{}'); Object.assign(S, { spread: k.spread || 1, layout: k.layout || 'layers', metric: k.metric || 'part', ind: k.ind ?? true }); } catch (_) {}
const keep = () => { try { localStorage.setItem('atlas', JSON.stringify({ layout: S.layout, metric: S.metric, ind: S.ind, spread: S.spread })); } catch (_) {} };
let MODEL, HIST, N = new Map(), OWN = new Map(), V = null, CK = [];

// ---------------------------------------------------------------- data
async function load() {
  const [m, h] = await Promise.all([fetch('model.json').then(r => r.json()), fetch('history.json').then(r => r.json())]);
  MODEL = m; HIST = h.commits;
  for (const c of m.components) N.set(c.id, { ...c, children: [] });
  for (const c of N.values()) { const p = c.id.includes('.') ? c.id.slice(0, c.id.lastIndexOf('.')) : null; c.parent = p && N.has(p) ? p : null; c.level = c.id.split('.').length; c.l1 = c.id.split('.')[0]; if (c.parent) N.get(c.parent).children.push(c.id); }
  for (const c of N.values()) for (const d of c.decls || []) OWN.set(d, c.id);
  // the versions: every commit rebuilt from the changes, with a full copy every 20 for the slider
  let st = { files: {}, decls: {}, du: {} };
  HIST.forEach((c, i) => { for (const k of ['files', 'decls', 'du']) for (const [n, x] of Object.entries(c[k] || {})) { if (x === null) delete st[k][n]; else st[k][n] = x; }
    if (i % 20 === 0) CK[i] = structuredClone(st); c._bytes = Object.values(st.decls).reduce((a, b) => a + b, 0); });
  S.ver = HIST.length - 1;
}
function stateAt(i) {
  const b = Math.floor(i / 20) * 20, st = structuredClone(CK[b]);
  for (let j = b + 1; j <= i; j++) for (const k of ['files', 'decls', 'du']) for (const [n, x] of Object.entries(HIST[j][k] || {})) { if (x === null) delete st[k][n]; else st[k][n] = x; }
  return st;
}
const owner = k => OWN.get(k) || MODEL.fileDefault[k.split('|')[0]] || null;
function assetBytes(a, files) { let s = 0; for (const [k, v] of Object.entries(files)) if (k === a || k.startsWith(a.endsWith('/') ? a : a + '/') || (k.endsWith('/') && a.startsWith(k) && false)) s += v; return s; }
function computeVersion(i) {
  const st = stateAt(i), ex = new Set(), code = new Map(), asset = new Map(), edges = new Map(), chg = new Set(), fdecl = new Map();
  for (const [k, s] of Object.entries(st.decls)) { const o = owner(k); if (!o) continue; ex.add(o); code.set(o, (code.get(o) || 0) + s); (fdecl.get(o) || fdecl.set(o, []).get(o)).push([k, s]); }
  for (const c of N.values()) for (const a of c.assets || []) { const b = assetBytes(a, st.files); if (b) { ex.add(c.id); asset.set(c.id, (asset.get(c.id) || 0) + b); } }
  for (const c of N.values()) if (c.l1 === 'tools' && !c.children.length) ex.add(c.id);
  for (const [k, us] of Object.entries(st.du)) { const a = owner(k); if (!a) continue; for (const u of us) { const b = owner(u); if (b && b !== a) edges.set(a + '>' + b, (edges.get(a + '>' + b) || 0) + 1); } }
  for (const k of Object.keys(HIST[i].decls || {})) { const o = owner(k); if (o) chg.add(o); }
  // a part with no code or files of its own exists when a partner of its flows does (online sources); parents when a child does
  for (const f of MODEL.flows) { if (ex.has(f.from) && !hasOwn(f.to)) ex.add(f.to); if (ex.has(f.to) && !hasOwn(f.from)) ex.add(f.from); }
  for (const id of [...ex]) { let p = N.get(id)?.parent; while (p) { ex.add(p); p = N.get(p).parent; } }
  for (const id of [...chg]) { let p = N.get(id)?.parent; while (p) { chg.add(p); p = N.get(p).parent; } }
  const tot = (id, m) => { const c = N.get(id); return (m.get(id) || 0) + c.children.reduce((a, x) => a + tot(x, m), 0); };
  return { st, ex, code, asset, edges, chg, fdecl, tot };
}
const hasOwn = id => { const c = N.get(id); return c && ((c.decls || []).length || (c.assets || []).length); };
function rating(id, m) {   // its own estimate, else the highest of its parts
  const c = N.get(id); if (c.res?.[m]) return c.res[m][0];
  return c.children.reduce((a, x) => Math.max(a, V.ex.has(x) ? rating(x, m) : 0), 0);
}
const fmtB = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : b >= 1e3 ? Math.round(b / 1e3) + ' KB' : b + ' B';
function netOf(id) { const c = N.get(id); if (c.net) return c.net; const s = new Set(c.children.filter(x => V.ex.has(x)).map(netOf)); return s.size === 1 ? [...s][0] : s.size ? 'both' : 'offline'; }

// ---------------------------------------------------------------- what is shown: open parts replaced by their parts
function visible() {
  const out = []; const walk = id => { const c = N.get(id); if (!V.ex.has(id)) return; const kids = c.children.filter(x => V.ex.has(x)); if (S.exp.has(id) && kids.length) kids.forEach(walk); else out.push(id); };
  MODEL.l1.forEach(l => walk(l.id)); return out;
}
function rep(id, vis) { let x = id; while (x && !vis.has(x)) x = N.get(x)?.parent; return x; }
function visEdges(vis) {
  const E = new Map();
  for (const [k, n] of V.edges) { const [a, b] = k.split('>'), ra = rep(a, vis), rb = rep(b, vis); if (!ra || !rb || ra === rb) continue; const key = 'c|' + ra + '>' + rb; const e = E.get(key) || { a: ra, b: rb, kind: 'code', n: 0, labels: [] }; e.n += n; E.set(key, e); }
  for (const f of MODEL.flows) { if (!V.ex.has(f.from) || !V.ex.has(f.to)) continue; const ra = rep(f.from, vis), rb = rep(f.to, vis); if (!ra || !rb || ra === rb) continue; const key = 'f|' + ra + '>' + rb; const e = E.get(key) || { a: ra, b: rb, kind: 'flow', n: 0, labels: [] }; e.n++; if (e.labels.length < 3) e.labels.push(f.label); E.set(key, e); }
  return [...E.values()];
}
// what the selected part relies on (following uses and incoming flows) and what relies on it – near and further
function reach(sel, edges) {
  const dep = e => e.kind === 'code' ? [e.a, e.b] : [e.b, e.a];   // [the part that relies, the part relied on]
  const walk = dir => { const d = new Map([[sel, 0]]), q = [sel]; while (q.length) { const x = q.shift(); for (const e of edges) { const [u, v] = dep(e), [f, t] = dir ? [u, v] : [v, u]; if (f === x && !d.has(t) && d.get(x) < S.depth) { d.set(t, d.get(x) + 1); q.push(t); } } } d.delete(sel); return d; };
  return { up: walk(true), down: walk(false) };
}

// ---------------------------------------------------------------- drawing

function sparkFor(id) {   // the code of this part over all versions (measured at every 4th version for speed)
  const keys = new Set(); const coll = x => { (N.get(x).decls || []).forEach(k => keys.add(k)); N.get(x).children.forEach(coll); }; coll(id);
  if (!keys.size) { d3.select('#pspark').remove(); return; }
  const st = {}, ys = []; HIST.forEach((cm, i) => { for (const [k, x] of Object.entries(cm.decls || {})) if (keys.has(k)) { if (x === null) delete st[k]; else st[k] = x; } ys.push(Object.values(st).reduce((a, b) => a + b, 0)); });
  drawSpark(d3.select('#pspark'), ys, S.ver);
}
function drawSpark(sv, ys, cur) {
  const w = sv.node().clientWidth || 300, h = sv.node().clientHeight || 30, x = d3.scaleLinear([0, ys.length - 1], [2, w - 2]), y = d3.scaleLinear([0, d3.max(ys) || 1], [h - 3, 3]);
  sv.selectAll('*').remove();
  sv.append('path').attr('d', d3.area().x((d, i) => x(i)).y0(h - 2).y1(d => y(d))(ys)).style('fill', css('--soft'));
  sv.append('path').attr('d', d3.line().x((d, i) => x(i)).y(d => y(d))(ys)).style('fill', 'none').style('stroke', css('--acc')).style('stroke-width', 1.4);
  sv.append('line').attr('x1', x(cur)).attr('x2', x(cur)).attr('y1', 0).attr('y2', h).style('stroke', css('--ink')).style('stroke-width', 1);
  sv.append('circle').attr('cx', x(cur)).attr('cy', y(ys[cur])).attr('r', 3).style('fill', css('--acc'));
}

// ---------------------------------------------------------------- versions
function setVer(i, quiet) {
  S.ver = i; V = computeVersion(i); const c = HIST[i];
  $('#verInfo').innerHTML = `<b>v${c.v ?? '?'}</b> · ${new Date(c.d).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })} · ${fmtB(c._bytes)} of code · ${esc(c.m)}`;
  $('#hdrVer').textContent = i === HIST.length - 1 ? `v${c.v}, current` : `showing v${c.v}`;
  drawSpark(d3.select('#spark'), HIST.map(h => h._bytes), i);
  if (S.sel && !V.ex.has(S.sel)) S.sel = null;
  draw(!quiet);
}
let playT = 0;
$('#play').onclick = () => { if (playT) { clearInterval(playT); playT = 0; $('#play').textContent = '▶'; return; }
  if (S.ver >= HIST.length - 1) S.ver = 0; $('#play').textContent = '❚❚';
  playT = setInterval(() => { if (S.ver >= HIST.length - 1) { clearInterval(playT); playT = 0; $('#play').textContent = '▶'; return; } $('#ver').value = S.ver + 1; setVer(S.ver + 1, true); }, 160); };
$('#ver').oninput = e => setVer(+e.target.value, true);

// ---------------------------------------------------------------- controls
function seg(sel, key, cb) {
  const dd = $(sel.replace('#seg', '#sel')), set = v => { S[key] = v; [...$(sel).children].forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); if (dd) dd.value = v; };
  $(sel).onclick = e => { const b = e.target.closest('button'); if (!b) return; set(b.dataset.v); keep(); cb?.(); draw(); };
  if (dd) dd.onchange = () => { set(dd.value); keep(); cb?.(); draw(); };
  set(S[key]);
}
seg('#segLayout', 'layout', () => { fitted = ''; }); seg('#segMetric', 'metric'); seg('#segFocus', 'focus', () => { if (S.focus !== 'all' && !S.sel) note2('Select a part first'); T3.fitNext = true; fitted = ''; setTimeout(() => S.layout !== '3d' && fit(), 60); });
function note2(t) { const h = $('#hint'), o = h.textContent; h.textContent = t; setTimeout(() => { h.textContent = o; }, 1800); }
$('#spread').value = S.spread;
$('#spread').oninput = e => { S.spread = +e.target.value; keep(); if (S.layout === '3d') { T3.alpha = Math.max(T3.alpha, 0.6); run3d(); } else draw(); };
function setFull(on) {
  document.body.classList.toggle('full', on); $('#fsBtn').innerHTML = on ? '✕' : '⛶'; $('#fsBtn').title = on ? 'Leave full screen' : 'Full screen';
  try { if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.()?.catch?.(() => {}); else if (!on && document.fullscreenElement) document.exitFullscreen?.(); } catch (_) {}
  setTimeout(() => { draw(); if (S.layout !== '3d') fit(); else { T3.fitNext = true; run3d(); } }, 120);
}
$('#fsBtn').onclick = () => setFull(!document.body.classList.contains('full'));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('full')) setFull(false); });
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('full')) setFull(false); });
$('#optBtn').onclick = () => { const m = $('#opts'), open = m.hidden; m.hidden = !open; $('#optBtn').setAttribute('aria-expanded', open); if (open) m.style.top = ($('header').getBoundingClientRect().bottom + 6) + 'px'; };
document.addEventListener('pointerdown', e => { if (!$('#opts').hidden && !e.target.closest('#opts, #optBtn')) { $('#opts').hidden = true; $('#optBtn').setAttribute('aria-expanded', false); } });
$('#ind').checked = S.ind; $('#ind').onchange = e => { S.ind = e.target.checked; keep(); draw(); };
$('#offv').onchange = e => { S.offv = e.target.checked; draw(); };
$('#lbl').onchange = e => { S.lbl = e.target.checked; draw(); };
$('#chain').onchange = e => { S.depth = e.target.checked ? 99 : 1; draw(); };
$('#expAll').onclick = () => { for (const c of N.values()) if (c.children.length) S.exp.add(c.id); draw(true); };
$('#colAll').onclick = () => { S.exp.clear(); draw(true); };
svg.on('click', () => { if (S.sel) select(null); });
$('#panel').onclick = e => { const g = e.target.closest('[data-go]'); if (g) { select(g.dataset.go); setTimeout(() => fit(g.dataset.go), 50); return; } const t = e.target.closest('[data-tog]'); if (t) toggle(t.dataset.tog); };
// search: parts by name, and functions by name
let hits = [], hi = 0;
$('#q').oninput = () => { const q = $('#q').value.trim().toLowerCase(); if (!q) { $('#res').hidden = true; return; }
  hits = [];
  for (const c of N.values()) if (V.ex.has(c.id) && (c.name.toLowerCase().includes(q) || c.id.includes(q))) hits.push({ id: c.id, t: c.name, s: N.get(c.parent)?.name || 'Pult' });
  for (const [k] of Object.entries(V.st.decls)) if (k.split('|')[1].toLowerCase().includes(q)) { const o = owner(k); if (o) hits.push({ id: o, t: k.split('|')[1] + '()', s: 'in ' + N.get(o).name }); }
  hits = hits.slice(0, 14); hi = 0; paintHits(); };
function paintHits() { const r = $('#q').getBoundingClientRect(); $('#res').style.left = Math.max(8, Math.min(innerWidth - 308, r.left)) + 'px'; $('#res').style.top = (r.bottom + 4) + 'px'; $('#res').hidden = !hits.length; $('#res').innerHTML = hits.map((h, i) => `<button data-i="${i}" class="${i === hi ? 'on' : ''}">${esc(h.t)}<small>${esc(h.s)}</small></button>`).join(''); }
$('#q').onkeydown = e => { if (e.key === 'ArrowDown') { hi = Math.min(hits.length - 1, hi + 1); paintHits(); e.preventDefault(); } else if (e.key === 'ArrowUp') { hi = Math.max(0, hi - 1); paintHits(); e.preventDefault(); } else if (e.key === 'Enter' && hits[hi]) go(hits[hi].id); else if (e.key === 'Escape') $('#res').hidden = true; };
$('#res').onclick = e => { const b = e.target.closest('button'); if (b) go(hits[+b.dataset.i].id); };
function go(id) { $('#res').hidden = true; $('#q').blur(); select(id); setTimeout(() => fit(id), 60); }
addEventListener('resize', () => draw());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => draw());

load().then(() => { $('#ver').max = HIST.length - 1; $('#ver').value = S.ver; setVer(S.ver); })
  .catch(e => { $('#panel').innerHTML = `<h2>Could not load</h2><p>${esc(e.message)}</p>`; });
</script>
