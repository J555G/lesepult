# Pult Atlas: rebuilt after every push, so the web app at /lesepult/atlas/ always shows the current version
# (tools/arch/README.md). Its own commits touch only atlas/ and do not start it again.
name: Rebuild the atlas
on:
  push:
    branches: [main]
    paths-ignore: ['atlas/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: sh tools/arch/build.sh --site
      - name: Commit the rebuilt atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas
          if git diff --cached --quiet; then echo "atlas unchanged"; exit 0; fi
          git commit -m "Atlas rebuilt for $(git log -1 --format=%h) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done; exit 1
