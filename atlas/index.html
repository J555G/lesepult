<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pult Atlas has moved</title>
<meta http-equiv="refresh" content="0; url=https://j555g.github.io/Pult-atlas/">
<script>
// the atlas now lives in its own repository; the old offline helper here removes itself
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope.endsWith('/atlas/')) r.unregister(); })).catch(() => {});
location.replace('https://j555g.github.io/Pult-atlas/');
</script></head>
<body style="font: 16px system-ui, sans-serif; padding: 24px">The Pult Atlas has moved to <a href="https://j555g.github.io/Pult-atlas/">j555g.github.io/Pult-atlas</a>.</body></html>
