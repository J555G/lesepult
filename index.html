<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Greek Reader">
<meta name="theme-color" content="#2a2926">
<title>Greek Reader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="menuwrap">
    <button id="btnMenu" title="Menu" aria-haspopup="true">☰</button>
    <div id="menu" hidden>
      <button data-m="texts">Texts …</button>
      <button data-m="dicts">Dictionaries …</button>
      <button data-m="pos">Word-class colours …</button>
      <button data-m="backup">Backup …</button>
      <button data-m="theme">☀ Light mode</button>
    </div>
  </div>
  <span id="textTitle" title="Current text">no text</span>
  <label class="sw" title="Show interlinear glosses"><input type="checkbox" id="chkGloss" checked> Glosses</label>
  <button id="btnAddGloss" title="Write a gloss for the selected word or phrase">＋ Gloss</button>
  <button id="btnRange" title="Phrase: tap the first word, then this, then the last word">Range</button>
  <label class="sw" title="Colour words by word class"><input type="checkbox" id="chkPos"> Colours</label>
  <button id="btnSplit" title="Change the split"></button>
  <span class="sp"></span>
  <button id="btnHl" title="Highlighter: mark dictionary text with the Pencil"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5l6 6-9.5 9.5H5v-6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 7l6 6" stroke="currentColor" stroke-width="1.6"/><path d="M3 21h9" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".6"/></svg></button>
  <button id="btnBack" title="Back" disabled>‹</button><button id="btnFwd" title="Forward" disabled>›</button>
  <div class="tabs"><button id="tabEntry" class="on">Entry</button><button id="tabList">Lemmata</button></div>
  <input id="search" type="search" placeholder="Look up a word…" autocapitalize="off" autocomplete="off" spellcheck="false">
</header>

<main id="panes">
  <section id="textPane" aria-label="Text">
    <div id="textBody"><p class="hint">No text yet. Open the menu ☰ (top left) → Texts to paste or load a text.</p></div>
  </section>
  <div id="divider" title="Drag to change the split"></div>
  <section id="dictPane" aria-label="Dictionary">
    <div id="dictBody"><p class="hint">Tap a word in the text.</p></div>
    <div id="listBody" hidden></div>
  </section>
</main>

<div id="fabBar" hidden><button id="fabGloss">＋ Gloss</button><button id="fabDefault" title="Use as default gloss for this lemma wherever it appears">＋ Default for lemma</button></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" hidden></div>
<input type="file" id="fileDict" multiple class="fileinput">
<input type="file" id="fileText" class="fileinput">
<input type="file" id="fileBackup" class="fileinput">
<script src="app.js"></script>
</body>
</html>
