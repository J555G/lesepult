<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pult">
<meta name="theme-color" content="#2a2926">
<title>Pult</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="menuwrap">
    <button id="btnMenu" title="Menu" aria-haspopup="true">☰</button>
    <div id="menu" hidden>
      <button data-m="library">Library</button>
      <button data-m="export" disabled>Export text</button>
      <button data-m="dicts">Instruments</button>
      <button data-m="settings">Settings</button>
      <button data-m="pult">This Pult</button>
      <button data-m="acks">Acknowledgements</button>
    </div>
  </div>
  <span class="navgrp"><button id="textTitle" title="Library"><span class="tw">Library</span></button></span>
  <button id="btnMark" title="Marker" disabled><svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M1.5 1.5h11v15l-5.5-4.2-5.5 4.2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
  <button id="btnGlossToggle" class="on" title="Show interlinear glosses" aria-pressed="true"><span class="w1">Glosses</span><span class="w2">Glosses</span></button>
  <button id="btnGram" title="Show grammatical information beneath each word" aria-pressed="false"><span class="w1">Grammar</span><span class="w2">nom sg</span></button>
  <button id="btnPos" title="Colour words by word class" aria-pressed="false"><span>C</span><span>o</span><span>l</span><span>o</span><span>u</span><span>r</span><span>s</span></button>
  <button id="btnSplit" title="Change the split"></button>
  <button id="btnRead" title="Reading mode: the text alone, full screen" aria-label="Reading mode"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></g></svg></button>
  <span class="sp"></span>
  <div class="tabs"><button id="tabEntry" class="on" title="Dictionary" aria-label="Dictionary"><i class="pape" aria-hidden="true"></i></button><button id="tabList" title="Lemmata" aria-label="Lemmata"><i class="cards" aria-hidden="true"></i></button><button id="tabPeople" title="Suda – encyclopaedias and lexica: persons, places, things" aria-label="Suda"><svg class="ppico" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.2" class="coin"/><circle cx="20" cy="20" r="15.6" class="rim"/><path class="bust" d="M14.6 33.2c.3-3.3 1.6-5.6 3.6-6.8-.9-.8-1.4-1.9-1.6-3.1l-1.9-.4c-.4-.1-.5-.5-.3-.8l1.5-2.1c-.2-.6-.2-1.3-.1-1.9-.6-.4-.8-1.1-.4-1.7.9-3.4 3.9-5.6 7.4-5.3 3.8.3 6.6 3.6 6.2 7.5-.2 2.2-1.4 4-3 5.1.4 1.2 1.6 2 3.1 2.5 1.4.5 2.5 1.6 3.1 3.1.5 1.2.6 2.6.5 3.9z"/><path class="laurel" d="M17.6 15.8c1.7-2.6 4.8-3.8 7.8-3.1M17.2 18.4c.6-.9 1.5-1.3 2.4-1.3M18.2 14.2c.9.1 1.5.7 1.7 1.5M21.3 12.6c.6.6.8 1.4.5 2.2M24.4 12.5c.3.8.1 1.6-.5 2.1"/></svg></button><button id="tabTempora" title="Tempora – the chronograph: reference systems, the years the texts narrate, your own chronology" aria-label="Tempora"><i class="tpimg" aria-hidden="true"></i></button><button id="tabMap" title="Map – tap again for the dictionary · hold for the layers" aria-label="Map"></button></div>
  <input id="search" type="search" placeholder="Look up a word…" autocapitalize="off" autocomplete="off" spellcheck="false">
</header>

<main id="panes">
  <section id="textPane" aria-label="Text">
    <div id="textBody"><p class="hint">No text yet. Tap <b>Library</b> (top left) to download texts in Bibliotheca, or + Import to import your own.</p></div>
  </section>
  <div id="divider" title="Drag to change the split"></div>
  <div id="edgeGrab" aria-hidden="true"></div>
  <section id="dictPane" aria-label="Dictionary">
    <div id="dictNav" hidden><button type="button" class="dnb" data-dn="back" aria-label="Back"><svg width="9" height="14" viewBox="0 0 9 14" aria-hidden="true"><path d="M7 1.5 1.8 7 7 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="dnb" data-dn="fwd" aria-label="Forward"><svg width="9" height="14" viewBox="0 0 9 14" aria-hidden="true"><path d="M2 1.5 7.2 7 2 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="dictHist" hidden></div></div>
    <div id="dictBody"><p class="hint">Tap a word in the text.</p></div>
    <div id="listBody" hidden></div>
    <div id="mapBody" hidden></div>
    <div id="peopleBody" hidden></div>
    <div id="temporaBody" hidden></div>
  </section>
</main>

<div id="readEdge" aria-hidden="true"></div>
<div id="fabBar" hidden><button id="fabHl" title="Highlight the selected text" aria-label="Highlight"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5l6 6-9.5 9.5H5v-6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 7l6 6" stroke="currentColor" stroke-width="1.6"/><path d="M3 21h9" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".6"/></svg></button><button id="fabGloss" title="Add the selected text to the gloss of the word">＋ Gloss</button><button id="fabDefault" title="Add the selected text to the default gloss of the lemma (used wherever it appears)">＋ Default</button></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" hidden></div>
<input type="file" id="fileDict" multiple class="fileinput">
<input type="file" id="fileText" class="fileinput">
<input type="file" id="fileBackup" class="fileinput">
<script src="crash.js"></script>
<script src="core.js"></script>
<script src="analysis.js"></script>
<script src="text.js"></script>
<script src="dictview.js"></script>
<script src="dialogs.js"></script>
<script src="export.js"></script>
<script src="library.js"></script>
<script src="libtime.js"></script>
<script src="libmenu.js"></script>
<script src="librev.js"></script>
<script src="glosses.js"></script>
<script src="search.js"></script>
<script src="people.js"></script>
<script src="tempora.js"></script>
<script src="app.js"></script>
<script src="maps.js"></script>
<script src="maplayers.js"></script>
<script src="mapsaved.js"></script>
<script src="mapdraw.js"></script>
<script src="maprelief.js"></script>
<script src="mapimg.js"></script>
<script src="mapsun.js"></script>
<script src="mapcam.js"></script>
</body>
</html>
