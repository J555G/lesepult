<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Greek Reader">
<meta name="theme-color" content="#efe9da">
<title>Greek Reader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button id="btnTexts" title="Texts">☰ <span id="textTitle">no text</span></button>
  <span class="sp"></span>
  <label class="sw" title="Show interlinear glosses"><input type="checkbox" id="chkGloss" checked> Glosses</label>
  <button id="btnAddGloss" title="Write a gloss for the selected word or phrase">＋ Gloss</button>
  <button id="btnRange" title="Phrase: tap the first word, then this, then the last word">Range</button>
  <span class="grp"><label class="sw" title="Colour words by word class"><input type="checkbox" id="chkPos"> Colours</label><button id="btnPosCfg" title="Choose word-class colours">⚙</button></span>
  <button id="btnLayout" title="Change the split">⇆</button>
  <button id="btnDicts">Dictionaries</button>
  <button id="btnBackup">Backup</button>
</header>

<main id="panes">
  <section id="textPane" aria-label="Text">
    <div id="textBody"><p class="hint">No text yet. Tap ☰ (top left) to paste or load a text.</p></div>
  </section>
  <div id="divider" title="Drag to change the split"></div>
  <section id="dictPane" aria-label="Dictionary">
    <div id="dictBar">
      <button id="btnBack" title="Back" disabled>‹</button>
      <div class="tabs"><button id="tabEntry" class="on">Entry</button><button id="tabList">Lemmata</button></div>
      <input id="search" type="search" placeholder="Look up a word…" autocapitalize="off" autocomplete="off" spellcheck="false">
    </div>
    <div id="target"></div>
    <div id="dictBody"><p class="hint">Tap a word in the text.</p></div>
    <div id="listBody" hidden></div>
  </section>
</main>

<button id="fabGloss" hidden>＋ Add as gloss</button>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" hidden></div>
<input type="file" id="fileDict" multiple class="fileinput">
<input type="file" id="fileText" class="fileinput">
<input type="file" id="fileBackup" class="fileinput">
<script src="app.js"></script>
</body>
</html>
